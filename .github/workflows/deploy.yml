name: Build and deploy

on:
  push:
    branches: [main]
  # Pull requests run the full build (including the CV PDF step) but skip the
  # deploy, so a broken build shows up on the PR instead of on main.
  pull_request:
  workflow_dispatch:
  # Rebuild daily so newly published Codyssey content (fetched at build time
  # in src/components/Writing.astro) appears without a manual push.
  schedule:
    - cron: '0 6 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Headless Chromium renders /cv to davor-minchorov-cv.pdf during the build
      # (scripts/generate-cv-pdf.mjs).
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      - uses: cloudflare/wrangler-action@v4
        if: github.event_name != 'pull_request'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
